# Python environment to run the tutorial notebooks on a GPU.
#
# author: laquitainesteeve@gmail.com
#
# Tested on: conda 25.5.1, driver-supported CUDA 12.8 (nvidia-smi), NVIDIA RTX 5090 GPU.
#
# From the repository root:
#
# ```bash
# conda env create -f environment.yml -n tutorials-env      # (1 min)
# conda activate tutorials-env
# python -m ipykernel install --user --name tutorials-env --display-name "tutorials-env"
# ```

name: tutorials-env
channels:
    - conda-forge
dependencies:
    - python=3.11                    # Python version the pipeline was tested with
    - numpy
    - scipy
    - matplotlib                     # plotting
    - h5py                           # TVSD .mat (v7.3) loading
    - pillow
    - pyyaml
    - tqdm
    - ipykernel                      # the jupyter kernel
    - ipywidgets                     # notebook progress bars (tqdm)
    - pytest                         # tests of the notebooks
    - pip
    - pip:
        - --extra-index-url https://download.pytorch.org/whl/cu128
        - torch==2.7.0               # STABLE cu128 build (Blackwell-capable); within the range multigeom declares
        - torchvision==0.22.0        # must match the torch build above
        - diffusers==0.37.1          # diffusion models
        - huggingface_hub==0.36.0
        - plenoptic==1.3.1
        - modal                  # optional: run the G(x) estimation on Modal GPUs (notebook 2)
